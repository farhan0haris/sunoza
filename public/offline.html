<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline – Sunoza Accessibility Assistant</title>
  <meta name="theme-color" content="#33446A" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F3EFE6;
      color: #252A31;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFCF7;
      border: 1px solid #DDD6C9;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 16px rgba(51, 68, 106, 0.06);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border-radius: 1.25rem;
      background: #33446A;
      color: #FFFCF7;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(51, 68, 106, 0.15);
    }
    .eyebrow {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #B86F58;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #33446A;
      line-height: 1.25;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #485E4B;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.875rem;
      background: #33446A;
      color: #FFFCF7;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover, .btn:focus-visible {
      background: #263350;
      outline: 2px solid #33446A;
      outline-offset: 2px;
    }
    .status-hint {
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: #485E4B;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #D99B37;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="eyebrow">Connection Status</div>
    <h1>You're currently offline</h1>
    <p>
      Sunoza requires an active connection to process voice recordings, analyze images, and interpret documents with cloud AI. Please verify your Wi-Fi or mobile data connection and try again.
    </p>

    <button type="button" class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>

    <div class="status-hint">
      <span class="dot" aria-hidden="true"></span>
      <span>Installed PWA app shell is ready</span>
    </div>
  </main>
</body>
</html>
